<!doctype html>
<html lang="en" data-dependency-variant="fixed">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AngularJS expression workspace · Repaired control</title>
  <link rel="stylesheet" href="../../../assets/css/playground.css">
  <script defer src="../expression.js"></script>
</head>
<body class="target-page">
  <main class="target-shell" data-playground-target="angular-expression-dependency-control">
    <p class="eyebrow">SCA · Dependency removed</p>
    <h1>Expression workspace</h1>
    <p>The same small expression feature uses an explicit local operation and no client framework.</p>
    <label for="expression">Expression</label>
    <input id="expression" value="value + 1" autocomplete="off">
    <button id="parse-expression" type="button">Evaluate expression</button>
    <output id="expression-result" aria-live="polite">Result: not run</output>
    <p><a href="../review/">Open review target</a></p>
  </main>
</body>
</html>
