name: Validate Playground

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ptk-playground-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install exact lockfile
        run: npm ci --ignore-scripts

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Validate public and security boundaries
        run: npm test

      - name: Validate local presenter runtime
        run: npm run demo:preflight

      - name: Validate browser journeys
        run: npm run test:browser
