name: Validate Playground

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ptk-playground-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.58.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install exact lockfile
        run: npm ci --ignore-scripts

      - name: Validate public and security boundaries
        run: |
          npm run catalog:check
          npm test

      - name: Validate local presenter runtime
        run: npm run demo:preflight

      - name: Validate browser journeys
        run: npm run test:browser

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build local demo image
        run: docker build --tag ptk-playground:ci .

      - name: Validate container runtime and DAST contract
        run: |
          cleanup() {
            docker logs ptk-playground-ci || true
            docker rm --force ptk-playground-ci || true
          }
          trap cleanup EXIT
          docker run --detach \
            --name ptk-playground-ci \
            --init \
            --read-only \
            --tmpfs /tmp:rw,size=16m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --publish 127.0.0.1:3080:3080 \
            --publish 127.0.0.1:3443:3443 \
            ptk-playground:ci
          npm run demo:container:smoke
