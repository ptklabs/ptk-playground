<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>IAST Referrer Helper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 24px; background: #0f172a; color: #e2e8f0; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 16px; max-width: 860px; }
    label { display: block; margin: 8px 0 4px; color: #cbd5e1; }
    input, button, select { width: 100%; border-radius: 10px; border: 1px solid #1f2937; padding: 10px; background: #0b1220; color: #e2e8f0; }
    button { margin-top: 10px; cursor: pointer; font-weight: 600; background: #2563eb; border: none; }
    button:hover { background: #1d4ed8; }
    .note { color: #94a3b8; font-size: 0.9rem; }
    .back-link { display: inline-block; margin-bottom: 12px; color: #93c5fd; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <a class="back-link" href="index.html">← Back to index</a>
  <h1>IAST Referrer Helper</h1>
  <div class="card">
    <p class="note">Use this helper to open another IAST fixture with a controlled <code>document.referrer</code>. The target page receives the payload through its query string; the referrer value itself remains this helper URL.</p>
    <label for="target">Target page</label>
    <select id="target">
      <option value="iast_dom_xss_secondary_sources.html">DOM XSS secondary sources</option>
      <option value="iast_open_redirect.html">Open redirect</option>
      <option value="iast_storage_taint_to_exec.html">Storage taint to exec</option>
      <option value="iast_session_material_cross_boundary_exfiltration.html">Session material cross-boundary</option>
      <option value="iast_storage_backed_request_reuse.html">Storage-backed request reuse</option>
      <option value="iast_websocket_url_poisoning.html">WebSocket URL poisoning</option>
      <option value="iast_form_submission_hijack.html">Form submission hijack</option>
      <option value="iast_dom_url_navigation.html">DOM URL navigation</option>
    </select>
    <label for="payload">Payload</label>
    <input id="payload" type="text" value="https://example.org/referrer-target?ptk=1">
    <button id="open">Open target with helper as referrer</button>
  </div>
  <script>
    document.getElementById('open').onclick = () => {
      const target = document.getElementById('target').value;
      const payload = document.getElementById('payload').value || '';
      const url = new URL(target, location.href);
      url.searchParams.set('payload', payload);
      location.href = url.toString();
    };
  </script>
</body>
</html>
