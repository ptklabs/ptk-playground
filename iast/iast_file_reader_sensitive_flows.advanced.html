<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>IAST FileReader Sensitive Flows</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 24px; background: #0f172a; color: #e2e8f0; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    label { display: block; margin: 8px 0 4px; color: #cbd5e1; }
    input, button, select { width: 100%; border-radius: 10px; border: 1px solid #1f2937; padding: 10px; background: #0b1220; color: #e2e8f0; }
    button { margin-top: 8px; cursor: pointer; font-weight: 600; background: #2563eb; border: none; }
    .note { color: #94a3b8; font-size: 0.9rem; }
    .back-link { display:inline-block; margin-bottom:12px; color:#93c5fd; text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <a class="back-link" href="index.html">← Back to index</a>
  <h1>IAST FileReader Sensitive Flows</h1>
  <p class="note">Covers FileReader sinks by using a tainted <code>File.name</code> / <code>Blob.type</code> carrier and reading it through each API.</p>
  <div class="card">
    <label for="payload">Tainted file marker</label>
    <input id="payload" type="text" value="secret-session-token.txt">
    <label for="sourceType">Source</label>
    <select id="sourceType">
      <option value="query">query</option>
      <option value="hashQuery">hashQuery</option>
      <option value="hashRoute">hashRoute</option>
      <option value="postMessage">postMessage</option>
      <option value="windowName">window.name</option>
      <option value="referrer">referrer (open via helper)</option>
      <option value="cookie">cookie</option>
      <option value="localStorage">localStorage</option>
      <option value="sessionStorage">sessionStorage</option>
      <option value="inline">inline</option>
    </select>
    <button id="prime">Prime source</button>
    <button id="btn-text">readAsText</button>
    <button id="btn-dataurl">readAsDataURL</button>
    <button id="btn-arraybuffer">readAsArrayBuffer</button>
    <p id="status" class="note">No source primed yet.</p>
  </div>
  <script>
    const payloadField = document.getElementById('payload');
    const status = document.getElementById('status');
    let lastMessage = null;
    function currentPayload() {
      const selected = document.getElementById('sourceType').value;
      const params = new URLSearchParams(location.search);
      const rawHash = location.hash ? decodeURIComponent(location.hash.slice(1)) : '';
      const hashParams = new URLSearchParams(rawHash.replace(/^#?/, ''));
      if (selected === 'query') return params.get('payload') || payloadField.value;
      if (selected === 'hashQuery') return hashParams.get('payload') || payloadField.value;
      if (selected === 'hashRoute') return rawHash || payloadField.value;
      if (selected === 'postMessage') return lastMessage || payloadField.value;
      if (selected === 'windowName') return window.name || payloadField.value;
      if (selected === 'referrer') return params.get('payload') || payloadField.value;
      if (selected === 'cookie') { const m = document.cookie.match(/(?:^|; )iast_payload=([^;]+)/); return m ? decodeURIComponent(m[1]) : payloadField.value; }
      if (selected === 'localStorage') return localStorage.getItem('iast_payload') || payloadField.value;
      if (selected === 'sessionStorage') return sessionStorage.getItem('iast_payload') || payloadField.value;
      return payloadField.value;
    }
    function makeFile() {
      const marker = currentPayload();
      return new File(['ptk'], marker, { type: marker });
    }
    document.getElementById('prime').onclick = () => {
      const payload = payloadField.value;
      const selected = document.getElementById('sourceType').value;
      if (selected === 'query') history.replaceState(null, '', '?payload=' + encodeURIComponent(payload));
      if (selected === 'hashQuery') location.hash = 'payload=' + encodeURIComponent(payload);
      if (selected === 'hashRoute') location.hash = encodeURIComponent(payload);
      if (selected === 'postMessage') window.postMessage(payload, '*');
      if (selected === 'windowName') window.name = payload;
      if (selected === 'cookie') document.cookie = 'iast_payload=' + encodeURIComponent(payload) + '; path=/';
      if (selected === 'localStorage') localStorage.setItem('iast_payload', payload);
      if (selected === 'sessionStorage') sessionStorage.setItem('iast_payload', payload);
      status.textContent = 'Primed source: ' + selected;
    };
    window.addEventListener('message', (event) => { if (typeof event.data === 'string') lastMessage = event.data; });
    function read(method) {
      const fr = new FileReader();
      const file = makeFile();
      fr.onload = () => { status.textContent = 'Completed ' + method + ' for ' + file.name; };
      fr[method](file);
    }
    document.getElementById('btn-text').onclick = () => read('readAsText');
    document.getElementById('btn-dataurl').onclick = () => read('readAsDataURL');
    document.getElementById('btn-arraybuffer').onclick = () => read('readAsArrayBuffer');
  </script>
</body>
</html>
