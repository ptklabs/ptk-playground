<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>IAST Form Submit CSRF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 24px; background: #0f172a; color: #e2e8f0; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    label { display: block; margin: 8px 0 4px; color: #cbd5e1; }
    input, button, select { width: 100%; border-radius: 10px; border: 1px solid #1f2937; padding: 10px; background: #0b1220; color: #e2e8f0; }
    button { margin-top: 8px; cursor: pointer; font-weight: 600; background: #2563eb; border: none; }
    .note { color: #94a3b8; font-size: 0.9rem; }
    .back-link { display:inline-block; margin-bottom:12px; color:#93c5fd; text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <a class="back-link" href="index.html">← Back to index</a>
  <h1>IAST Form Submit and requestSubmit</h1>
  <p class="note">Exercises <code>iast_form_submit_csrf</code> by executing tainted form targets through <code>submit()</code> and <code>requestSubmit()</code>.</p>

  <div class="card">
    <label for="payload">Form target payload</label>
    <input id="payload" value="https://example.org/form-submit?ptk=1">
    <label for="sourceType">Source type</label>
    <select id="sourceType">
      <option value="query">query</option>
      <option value="hashQuery">hashQuery</option>
      <option value="pathname">pathname</option>
      <option value="postMessage">postMessage</option>
      <option value="windowName">window.name</option>
    </select>
    <button id="prime">Prime selected source</button>
  </div>

  <div class="card">
    <form id="target-form" method="POST">
      <button id="submit-btn" type="submit">Submit form</button>
    </form>
    <button id="btn-set-action">Set form.action from source</button>
    <button id="btn-set-formaction">Set submitter formAction from source</button>
    <button id="btn-submit">Call form.submit()</button>
    <button id="btn-request-submit">Call form.requestSubmit(button)</button>
  </div>

  <script>
    let lastMessage = null;
    function selectedValue() {
      const type = document.getElementById('sourceType').value;
      const rawHash = location.hash ? decodeURIComponent(location.hash.slice(1)) : '';
      if (type === 'query') return new URLSearchParams(location.search).get('payload') || document.getElementById('payload').value;
      if (type === 'hashQuery') return new URLSearchParams(rawHash).get('payload') || document.getElementById('payload').value;
      if (type === 'pathname') return location.pathname || document.getElementById('payload').value;
      if (type === 'postMessage') return lastMessage || document.getElementById('payload').value;
      if (type === 'windowName') return window.name || document.getElementById('payload').value;
      return document.getElementById('payload').value;
    }

    window.addEventListener('message', (event) => {
      if (typeof event.data === 'string') lastMessage = event.data;
    });

    document.getElementById('prime').onclick = () => {
      const payload = document.getElementById('payload').value;
      const type = document.getElementById('sourceType').value;
      if (type === 'query') history.replaceState(null, '', '?payload=' + encodeURIComponent(payload));
      if (type === 'hashQuery') location.hash = 'payload=' + encodeURIComponent(payload);
      if (type === 'pathname') history.replaceState(null, '', '/' + encodeURIComponent(payload).replace(/%2F/g, '/'));
      if (type === 'postMessage') window.postMessage(payload, '*');
      if (type === 'windowName') window.name = payload;
    };

    document.getElementById('btn-set-action').onclick = () => {
      document.getElementById('target-form').action = selectedValue();
    };

    document.getElementById('btn-set-formaction').onclick = () => {
      document.getElementById('submit-btn').formAction = selectedValue();
    };

    document.getElementById('btn-submit').onclick = () => {
      document.getElementById('target-form').submit();
    };

    document.getElementById('btn-request-submit').onclick = () => {
      document.getElementById('target-form').requestSubmit(document.getElementById('submit-btn'));
    };
  </script>
</body>
</html>
