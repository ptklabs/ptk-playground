<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>IAST Blob Object URL Execution</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 24px; background: #0f172a; color: #e2e8f0; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    label { display: block; margin: 8px 0 4px; color: #cbd5e1; }
    textarea, button, input { width: 100%; border-radius: 10px; border: 1px solid #1f2937; padding: 10px; background: #0b1220; color: #e2e8f0; }
    textarea { min-height: 96px; }
    button { margin-top: 8px; cursor: pointer; font-weight: 600; background: #2563eb; border: none; }
    .note { color: #94a3b8; font-size: 0.9rem; }
    .back-link { display:inline-block; margin-bottom:12px; color:#93c5fd; text-decoration:none; font-weight:600; }
    iframe { width: 100%; min-height: 120px; border: 1px dashed #1f2937; border-radius: 10px; background: #fff; }
  </style>
</head>
<body>
  <a class="back-link" href="index.html">← Back to index</a>
  <h1>IAST Blob and Object URL Execution</h1>
  <p class="note">Exercises the <code>iast_blob_object_url_execution</code> module by turning tainted Blob content into object URLs and feeding them into executable sinks.</p>

  <div class="card">
    <label for="payload">Blob payload</label>
    <textarea id="payload">console.log('ptk-objecturl')</textarea>
    <label for="iframeMarkup">Iframe payload</label>
    <input id="iframeMarkup" value="<h1>ptk-objecturl-frame</h1>">
    <button id="btn-script-url">Create object URL and assign to script.src</button>
    <button id="btn-iframe-url">Create object URL and assign to iframe.src</button>
    <button id="btn-worker-url">Create object URL and pass to Worker()</button>
  </div>

  <div class="card">
    <iframe id="target-frame" title="Object URL iframe sink"></iframe>
  </div>

  <script>
    function blobUrlForText(text, type) {
      const blob = new Blob([text], { type });
      return URL.createObjectURL(blob);
    }

    document.getElementById('btn-script-url').onclick = () => {
      const url = blobUrlForText(document.getElementById('payload').value, 'text/javascript');
      const script = document.createElement('script');
      script.src = url;
      document.body.appendChild(script);
    };

    document.getElementById('btn-iframe-url').onclick = () => {
      const url = blobUrlForText(document.getElementById('iframeMarkup').value, 'text/html');
      document.getElementById('target-frame').src = url;
    };

    document.getElementById('btn-worker-url').onclick = () => {
      const url = blobUrlForText('self.onmessage = () => postMessage("ptk-worker");', 'text/javascript');
      const worker = new Worker(url);
      worker.postMessage('go');
      worker.onmessage = () => {};
    };
  </script>
</body>
</html>
