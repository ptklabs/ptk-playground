<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DOM-based test cases — DOM clobbering</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./css/style.css" type="text/css" />
</head>
<body>
  <div class="container">
    <div class="topbar">
      <a class="back" href="index.html">← Back to index</a>
      <h1 class="title">DOM clobbering</h1>
    </div>
    <p class="meta">Tainted ids/names that can shadow globals through element attributes.</p>

    <div class="card" data-rule="taint" data-severity="high">
      <div class="card-meta"><strong>INLINE-1 (High): hash → form.name</strong></div>
      <pre><code>const nameValue = location.hash;
const form = document.createElement('form');
form.name = nameValue;
document.body.appendChild(form);</code></pre>
      <script>
        (function () {
          const nameValue = location.hash;
          const form = document.createElement('form');
          form.name = nameValue;
          document.body.appendChild(form);
        })();
      </script>
    </div>
  </div>
</body>
</html>
